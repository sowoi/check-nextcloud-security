name: nox check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  uv-test:
    name: python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install the project
        run: uv sync --group test

      - name: Run tests
        run: uv run --group test nox -s "versions_check-${{ matrix.python }}"
