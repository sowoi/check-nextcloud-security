name: Publish to PyPI

on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  publish:
    name: Read version and publish
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Read version
        id: version
        run: echo "version=$(uv version --short)" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: check_tag
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "Tag v${{ steps.version.outputs.version }} already exists. Skipping publish."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # The release schedule is scraped before the wheel is built so that the
      # published package rates unsupported major releases as end of life.
      # A layout change on the wiki must not block a release, hence
      # --allow-failure: the previously committed file stays in place.
      - name: Refresh supported Nextcloud versions
        if: steps.check_tag.outputs.exists != 'true'
        run: python scripts/update_supported_versions.py --allow-failure

      # The release notes are committed in the release pull request by the
      # release-notes workflow. They are generated again here so that the
      # GitHub release body is always right, even if that step was skipped.
      - name: Update CHANGELOG.md and RELEASE.md
        if: steps.check_tag.outputs.exists != 'true'
        run: python scripts/release_notes.py --version "${{ steps.version.outputs.version }}"

      - name: Build package
        if: steps.check_tag.outputs.exists != 'true'
        run: uv build

      - name: Publish to PyPI
        if: steps.check_tag.outputs.exists != 'true'
        run: uv publish

      - name: Create Git tag and GitHub release
        if: steps.check_tag.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

          # --notes-file provides the body, --generate-notes appends GitHub's
          # own "What's Changed" section below it.
          gh release create "v${{ steps.version.outputs.version }}" \
            dist/* \
            --title "v${{ steps.version.outputs.version }}" \
            --notes-file RELEASE.md \
            --generate-notes

      # main is protected, so nothing is pushed here. Should the generated
      # files differ from main, a follow-up pull request is opened after the
      # release instead of failing it.
      - name: Open pull request for missing release notes
        if: steps.check_tag.outputs.exists != 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: |
            CHANGELOG.md
            RELEASE.md
            nextcloud_local_scan/data/supported_versions.json
          branch: docs/release-notes-v${{ steps.version.outputs.version }}
          commit-message: "docs: release notes for v${{ steps.version.outputs.version }}"
          title: "docs: release notes for v${{ steps.version.outputs.version }}"
          body: |
            The release pull request for v${{ steps.version.outputs.version }} did not contain
            up-to-date release notes. This commits the files the release was built with.
          delete-branch: true
